<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>O'quvchi Portali - History Pro</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
      :root {
        --glass-bg: rgba(20, 20, 30, 0.95);
        --primary: #0a84ff;
        --text: #fff;
      }
      body {
        font-family: "Inter", sans-serif;
        background: url("https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2564&auto=format&fit=crop")
          center fixed;
        background-size: cover;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0;
        color: var(--text);
        padding: 15px;
        box-sizing: border-box;
      }
      .glass-panel {
        background: var(--glass-bg);
        border-radius: 32px;
        padding: 25px;
        width: 100%;
        max-width: 450px;
        text-align: center;
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        animation: fadeIn 0.4s ease;
        position: relative;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .hidden {
        display: none !important;
      }
      h2 {
        margin-top: 0;
        font-weight: 800;
        font-size: 26px;
      }
      p.subtitle {
        color: #aaa;
        margin-bottom: 20px;
        font-size: 14px;
      }
      .ios-input {
        background: rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 16px;
        padding: 15px;
        color: #fff;
        width: 100%;
        box-sizing: border-box;
        outline: none;
        margin-bottom: 15px;
        font-size: 16px;
        transition: 0.3s;
      }
      .ios-input:focus {
        border-color: var(--primary);
      }
      .btn-ios {
        border: none;
        border-radius: 16px;
        padding: 15px;
        font-weight: 700;
        font-size: 16px;
        width: 100%;
        cursor: pointer;
        background: var(--primary);
        color: #fff;
        transition: 0.2s;
      }
      .btn-ios:active {
        transform: scale(0.97);
      }
      .btn-danger {
        background: rgba(255, 69, 58, 0.15);
        color: #ff6961;
        border: 1px solid rgba(255, 69, 58, 0.3);
        margin-top: 15px;
      }

      .top-nav {
        display: flex;
        background: rgba(0, 0, 0, 0.3);
        border-radius: 20px;
        padding: 5px;
        margin-bottom: 20px;
      }
      .nav-btn {
        flex: 1;
        background: transparent;
        border: none;
        color: #aaa;
        padding: 10px;
        border-radius: 15px;
        font-weight: 700;
        cursor: pointer;
        transition: 0.3s;
      }
      .nav-btn.active {
        background: rgba(255, 255, 255, 0.15);
        color: #fff;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      }

      .profile-header {
        display: flex;
        align-items: center;
        gap: 15px;
        margin-bottom: 15px;
        background: rgba(255, 255, 255, 0.05);
        padding: 15px;
        border-radius: 20px;
        border: 1px solid rgba(255, 255, 255, 0.05);
        text-align: left;
      }
      .avatar {
        font-size: 35px;
        background: rgba(10, 132, 255, 0.2);
        width: 60px;
        height: 60px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        border: 2px solid rgba(10, 132, 255, 0.5);
      }
      .level-badge {
        display: inline-block;
        background: linear-gradient(45deg, #ffd60a, #ff9f0a);
        color: #000;
        padding: 3px 10px;
        border-radius: 10px;
        font-size: 12px;
        font-weight: 800;
        margin-top: 5px;
        text-transform: uppercase;
      }

      .stats-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-bottom: 20px;
      }
      .stat-card {
        background: rgba(255, 255, 255, 0.05);
        border-radius: 16px;
        padding: 15px 5px;
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
      .stat-value {
        font-size: 1.6rem;
        font-weight: 800;
        margin-bottom: 5px;
      }
      .stat-label {
        font-size: 0.75rem;
        color: #aaa;
        font-weight: 600;
        text-transform: uppercase;
      }

      .badges-box {
        display: flex;
        gap: 8px;
        margin-bottom: 20px;
        flex-wrap: wrap;
        justify-content: center;
      }
      .badge-item {
        background: rgba(255, 255, 255, 0.1);
        padding: 6px 12px;
        border-radius: 12px;
        font-size: 13px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 5px;
        border: 1px solid rgba(255, 255, 255, 0.15);
      }
      .badge-special {
        border-color: rgba(255, 69, 58, 0.5);
        background: rgba(255, 69, 58, 0.1);
        color: #ff6961;
      }

      .month-selector {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding-bottom: 10px;
        margin-bottom: 10px;
        scrollbar-width: none;
      }
      .month-selector::-webkit-scrollbar {
        display: none;
      }
      .month-btn {
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.05);
        color: #ccc;
        padding: 8px 16px;
        border-radius: 12px;
        cursor: pointer;
        white-space: nowrap;
        font-size: 14px;
        font-weight: 600;
        transition: 0.3s;
      }
      .month-btn.active {
        background: var(--primary);
        color: white;
        border-color: var(--primary);
      }
      .chart-container {
        position: relative;
        overflow: hidden;
        background: rgba(0, 0, 0, 0.3);
        border-radius: 20px;
        padding: 10px;
        height: 200px;
        width: 100%;
        box-sizing: border-box;
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
      canvas#studentChart {
        position: absolute;
        left: 0;
        top: 0;
        width: 100% !important;
        height: 100% !important;
      }

      .lb-mode {
        display: flex;
        gap: 5px;
        margin-bottom: 15px;
      }
      .lb-mode-btn {
        flex: 1;
        padding: 8px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: #aaa;
        border-radius: 12px;
        cursor: pointer;
        transition: 0.2s;
        font-weight: 600;
      }
      .lb-mode-btn.active {
        background: rgba(255, 255, 255, 0.2);
        color: #fff;
      }
      .lb-list {
        max-height: 450px;
        overflow-y: auto;
        text-align: left;
        padding-right: 5px;
      }
      .lb-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 15px;
        margin-bottom: 8px;
        background: rgba(0, 0, 0, 0.3);
        border-radius: 16px;
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
      .lb-rank {
        font-weight: 800;
        font-size: 18px;
        width: 30px;
        display: inline-block;
        color: #888;
      }
      .lb-rank.top-1 {
        color: #ffd60a;
      }
      .lb-rank.top-2 {
        color: #e5e4e2;
      }
      .lb-rank.top-3 {
        color: #cd7f32;
      }
      .lb-name {
        font-weight: 600;
        font-size: 16px;
      }
      .lb-score {
        font-weight: 800;
        font-size: 18px;
      }

      #loadingMsg {
        color: #aaa;
        font-size: 14px;
        margin-top: 20px;
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="loginPage" class="glass-panel">
      <h2>👋 Xush kelibsiz</h2>
      <p class="subtitle">Natijalaringizni ko'rish uchun kiring</p>
      <input
        type="text"
        id="sName"
        class="ios-input"
        placeholder="Ismingiz (Masalan: Davron)"
        autocomplete="off"
      />
      <input type="password" id="sPass" class="ios-input" placeholder="Parol" />
      <button class="btn-ios" onclick="login()">KIRISH</button>
      <p
        id="errorMsg"
        style="color: #ff6961; font-size: 14px; margin-top: 15px"
      ></p>
    </div>

    <div id="dashboardPage" class="glass-panel hidden">
      <div class="top-nav">
        <button
          class="nav-btn active"
          id="nav-profile"
          onclick="switchTab('profile')"
        >
          👤 Profilim
        </button>
        <button class="nav-btn" id="nav-lb" onclick="switchTab('lb')">
          🏆 Reyting
        </button>
      </div>

      <div id="tab-profile">
        <div class="profile-header">
          <div class="avatar" id="avatarEmoji">🌱</div>
          <div>
            <h2 id="welcomeMsg" style="margin: 0; font-size: 20px">...</h2>
            <div id="studentLevel" class="level-badge">Yuklanmoqda...</div>
          </div>
        </div>

        <div id="badgesContainer" class="badges-box"></div>

        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-value text-white" id="totalTests">0</div>
            <div class="stat-label">Darslar</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="avgScore" style="color: #30d158">
              0%
            </div>
            <div class="stat-label">O'rtacha</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="totalStrikes" style="color: #ff453a">
              0
            </div>
            <div class="stat-label">Strike 🔥</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="totalCoins" style="color: #ffd60a">
              0
            </div>
            <div class="stat-label">Coin 🪙</div>
          </div>
        </div>

        <div id="monthSelector" class="month-selector"></div>
        <div class="chart-container"><canvas id="studentChart"></canvas></div>
        <p id="loadingMsg">Ma'lumotlar yuklanmoqda...</p>

        <button class="btn-ios btn-danger mt-3" onclick="logout()">
          Tizimdan chiqish
        </button>
      </div>

      <div id="tab-lb" class="hidden">
        <h3 style="margin-top: 0; font-weight: 800">Top O'quvchilar</h3>
        <p class="subtitle" style="margin-bottom: 15px">
          Sinfdagi umumiy reyting
        </p>
        <div class="lb-mode">
          <button
            class="lb-mode-btn active"
            id="btnLbCoin"
            onclick="renderLb('coin')"
          >
            🪙 Coinlar
          </button>
          <button
            class="lb-mode-btn"
            id="btnLbStrike"
            onclick="renderLb('strike')"
          >
            🔥 Strikelar
          </button>
        </div>
        <div id="lbList" class="lb-list">
          <div class="text-center text-white-50 mt-4">Yuklanmoqda...</div>
        </div>
      </div>
    </div>

    <script>
      const API =
        "https://script.google.com/macros/s/AKfycbw3h4fNBTHSRWRVCZfhPapSJySNzvTzmMFjuxJm-PFUBZru-tNOV3Mp9oBEXcZcPRR0/exec";

      let chartInstance = null;
      let groupedData = {};
      let globalLbData = [];
      let currentStudentName = "";

      const savedUser = localStorage.getItem("studentUser");
      if (savedUser) {
        currentStudentName = savedUser;
        showDashboard();
      }

      async function login() {
        const name = document.getElementById("sName").value.trim();
        const pass = document.getElementById("sPass").value.trim();
        const btn = document.querySelector("#loginPage .btn-ios");
        const err = document.getElementById("errorMsg");
        if (!name || !pass) {
          err.innerText = "Ism va parolni kiriting!";
          return;
        }

        btn.disabled = true;
        btn.innerText = "Tekshirilmoqda...";
        err.innerText = "";
        try {
          let res = await fetch(API, {
            method: "POST",
            body: JSON.stringify({
              action: "student_login",
              login: name,
              password: pass,
            }),
          });
          let data = await res.json();
          if (data.status === "success") {
            localStorage.setItem("studentUser", data.name);
            currentStudentName = data.name;
            showDashboard();
          } else {
            err.innerText = "Xato parol yoki ism!";
            btn.disabled = false;
            btn.innerText = "KIRISH";
          }
        } catch (e) {
          err.innerText = "Internet xatosi!";
          btn.disabled = false;
          btn.innerText = "KIRISH";
        }
      }

      function showDashboard() {
        document.getElementById("loginPage").classList.add("hidden");
        document.getElementById("dashboardPage").classList.remove("hidden");
        document.getElementById("welcomeMsg").innerText = currentStudentName;

        setTimeout(() => {
          fetchHistoryData();
        }, 100);
        fetchLeaderboard();
      }

      function switchTab(tab) {
        document.getElementById("nav-profile").classList.remove("active");
        document.getElementById("nav-lb").classList.remove("active");
        document.getElementById("tab-profile").classList.add("hidden");
        document.getElementById("tab-lb").classList.add("hidden");

        document.getElementById("nav-" + tab).classList.add("active");
        document.getElementById("tab-" + tab).classList.remove("hidden");
      }

      async function fetchHistoryData() {
        const loader = document.getElementById("loadingMsg");
        loader.style.display = "block";
        try {
          let res = await fetch(API, {
            method: "POST",
            body: JSON.stringify({
              action: "get_student_history",
              name: currentStudentName,
            }),
          });
          let data = await res.json();
          loader.style.display = "none";
          if (data.status === "success") processHistoryData(data.history);
        } catch (e) {
          loader.innerText = "Xatolik yuz berdi.";
          loader.style.display = "block";
        }
      }

      function processHistoryData(history) {
        // Umumiy statistika faqat Nishonlar va Darajalar uchun hisoblanadi
        let allTimeTests = history.length;
        let allTimeCoins = 0,
          allTimeStrikes = 0,
          sumPercent = 0;
        let count100 = 0,
          neverBelow50 = true,
          hasKamikadze = false;

        for (let i = 0; i < history.length; i++) {
          let h = history[i];
          let p = parseFloat(h.percent);
          sumPercent += p;

          allTimeCoins += parseInt(h.coin) || 0;
          allTimeStrikes += parseInt(h.strike) || 0;
          if (allTimeStrikes < 0) allTimeStrikes = 0;

          if (p === 100) count100++;
          if (p < 50) neverBelow50 = false;

          if (i > 0) {
            let prevP = parseFloat(history[i - 1].percent);
            if (prevP < 50 && p === 100) hasKamikadze = true;
          }
        }

        let allTimeAvg =
          allTimeTests > 0 ? Math.round(sumPercent / allTimeTests) : 0;

        // Darajalar
        let level = "Boshlovchi 🌱",
          avatar = "🌱";
        if (allTimeTests >= 30 && allTimeCoins >= 20 && allTimeStrikes >= 5) {
          level = "Akademik 👑";
          avatar = "👑";
        } else if (allTimeTests >= 15 && allTimeAvg >= 70) {
          level = "Tarixchi 🏛️";
          avatar = "📜";
        } else if (allTimeTests >= 5 && allTimeCoins >= 3) {
          level = "Izlanuvchi 🔍";
          avatar = "🕵️";
        }

        document.getElementById("studentLevel").innerText = level;
        document.getElementById("avatarEmoji").innerText = avatar;

        // Nishonlar
        let bHTML = "";
        if (count100 >= 3) bHTML += `<div class="badge-item">🎯 Snayper</div>`;
        if (allTimeCoins >= 20)
          bHTML += `<div class="badge-item">💰 Boyvachcha</div>`;
        if (allTimeStrikes >= 10)
          bHTML += `<div class="badge-item">🔥 Olovli</div>`;
        if (allTimeTests >= 30 && neverBelow50)
          bHTML += `<div class="badge-item">🏅 Faxriy</div>`;
        if (hasKamikadze)
          bHTML += `<div class="badge-item badge-special">🛡️ Qutqaruvchi</div>`;

        if (bHTML === "")
          bHTML = `<div class="badge-item" style="opacity:0.5; border:none; box-shadow:none;">Nishonlar yo'q</div>`;
        document.getElementById("badgesContainer").innerHTML = bHTML;

        // ⚠️ DIQQAT: Ekranga "All-time" ma'lumotlarni yozish qismini O'CHIRDIM!
        // Ular endi faqat tanlangan oyga qarab drawMonthData() orqali o'zgaradi.

        groupedData = {};
        const mNames = [
          "",
          "Yanvar",
          "Fevral",
          "Mart",
          "Aprel",
          "May",
          "Iyun",
          "Iyul",
          "Avgust",
          "Sentyabr",
          "Oktyabr",
          "Noyabr",
          "Dekabr",
        ];
        history.forEach((item) => {
          let key = `${item.year}-${item.month}`;
          if (!groupedData[key]) {
            groupedData[key] = {
              label: `${mNames[item.month]} ${item.year}`,
              items: [],
            };
          }
          groupedData[key].items.push(item);
        });
        renderMonthButtons();
      }

      function renderMonthButtons() {
        const container = document.getElementById("monthSelector");
        container.innerHTML = "";
        let keys = Object.keys(groupedData);
        if (keys.length === 0) return;
        keys.sort((a, b) => {
          let [yA, mA] = a.split("-").map(Number),
            [yB, mB] = b.split("-").map(Number);
          return yB !== yA ? yB - yA : mB - mA;
        });

        keys.forEach((key, i) => {
          let btn = document.createElement("button");
          btn.className = "month-btn" + (i === 0 ? " active" : "");
          btn.innerText = groupedData[key].label;
          btn.onclick = () => {
            document
              .querySelectorAll(".month-btn")
              .forEach((b) => b.classList.remove("active"));
            btn.classList.add("active");
            drawMonthData(key);
          };
          container.appendChild(btn);
        });
        drawMonthData(keys[0]);
      }

      function drawMonthData(monthKey) {
        let data = groupedData[monthKey].items;

        // 🎯 XATONI TUZATISH: Oylik raqamlarni shu yerda hisoblaymiz!
        let mTests = data.length;
        let mCoins = 0;
        let mStrikes = 0;
        let mSumPercent = 0;

        data.forEach((h) => {
          mSumPercent += parseFloat(h.percent);
          mCoins += parseInt(h.coin) || 0;
          mStrikes += parseInt(h.strike) || 0;
        });

        let mAvg = mTests > 0 ? Math.round(mSumPercent / mTests) : 0;

        // Dastur faqat shu oygacha tegishli bo'lgan raqamlarni ekranga chiqaradi:
        document.getElementById("totalTests").innerText = mTests;
        document.getElementById("avgScore").innerText = mAvg + "%";
        document.getElementById("totalStrikes").innerText = mStrikes;
        document.getElementById("totalCoins").innerText = mCoins;

        const ctx = document.getElementById("studentChart").getContext("2d");
        if (chartInstance) chartInstance.destroy();
        chartInstance = new Chart(ctx, {
          type: "line",
          data: {
            labels: data.map((h) => h.date),
            datasets: [
              {
                data: data.map((h) => h.percent),
                borderColor: "#0a84ff",
                backgroundColor: "rgba(10, 132, 255, 0.15)",
                borderWidth: 3,
                pointBackgroundColor: "#fff",
                fill: true,
                tension: 0.3,
              },
            ],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              y: {
                beginAtZero: true,
                max: 100,
                grid: { color: "rgba(255,255,255,0.1)" },
                ticks: { color: "#aaa", stepSize: 25 },
              },
              x: { grid: { display: false }, ticks: { color: "#aaa" } },
            },
            plugins: {
              legend: { display: false },
              tooltip: { callbacks: { label: (c) => c.parsed.y + "%" } },
            },
          },
        });
      }

      async function fetchLeaderboard() {
        try {
          let res = await fetch(API, {
            method: "POST",
            body: JSON.stringify({ action: "get_leaderboard" }),
          });
          let data = await res.json();
          if (data.status === "success") {
            globalLbData = data.leaderboard;
            renderLb("coin");
          }
        } catch (e) {
          document.getElementById("lbList").innerHTML =
            "<div class='text-danger'>Yuklashda xatolik!</div>";
        }
      }

      function renderLb(type) {
        document.getElementById("btnLbCoin").classList.remove("active");
        document.getElementById("btnLbStrike").classList.remove("active");

        let sortedData = [...globalLbData];
        let listHTML = "";

        if (type === "coin") {
          document.getElementById("btnLbCoin").classList.add("active");
          sortedData.sort((a, b) => b.coin - a.coin);
          sortedData.forEach((u, i) => {
            if (u.coin === 0 && u.strike === 0) return;
            let rClass =
              i === 0 ? "top-1" : i === 1 ? "top-2" : i === 2 ? "top-3" : "";
            let isMe =
              u.name.toLowerCase() === currentStudentName.toLowerCase()
                ? "border-primary"
                : "border-white border-opacity-10";
            listHTML += `
                    <div class="lb-item border ${isMe}">
                        <div><span class="lb-rank ${rClass}">${i + 1}</span> <span class="lb-name">${u.name}</span></div>
                        <div class="lb-score text-warning">${u.coin} 🪙</div>
                    </div>`;
          });
        } else {
          document.getElementById("btnLbStrike").classList.add("active");
          sortedData.sort((a, b) => b.strike - a.strike);
          sortedData.forEach((u, i) => {
            if (u.coin === 0 && u.strike === 0) return;
            let rClass =
              i === 0 ? "top-1" : i === 1 ? "top-2" : i === 2 ? "top-3" : "";
            let isMe =
              u.name.toLowerCase() === currentStudentName.toLowerCase()
                ? "border-primary"
                : "border-white border-opacity-10";
            listHTML += `
                    <div class="lb-item border ${isMe}">
                        <div><span class="lb-rank ${rClass}">${i + 1}</span> <span class="lb-name">${u.name}</span></div>
                        <div class="lb-score" style="color: #ff453a;">${u.strike} 🔥</div>
                    </div>`;
          });
        }

        if (listHTML === "")
          listHTML =
            "<div class='text-center text-white-50 mt-4'>Ro'yxat bo'sh</div>";
        document.getElementById("lbList").innerHTML = listHTML;
      }

      function logout() {
        localStorage.removeItem("studentUser");
