<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <title>Classroom AI — Ultimate Pro</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
      :root {
        --glass-bg: rgba(20, 20, 30, 0.85);
        --glass-border: rgba(255, 255, 255, 0.1);
        --primary-grad: linear-gradient(135deg, #0a84ff, #0055d4);
        --telegram-grad: linear-gradient(135deg, #2aabee, #229ed9);
        --success-grad: linear-gradient(135deg, #30d158, #1da63d);
        --danger-grad: linear-gradient(135deg, #ff453a, #c7251c);
        --text-main: #ffffff;
      }
      body {
        font-family: "Inter", sans-serif;
        background: url("https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2564&auto=format&fit=crop")
          no-repeat center center fixed;
        background-size: cover;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0;
        color: var(--text-main);
      }
      body::before {
        content: "";
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        z-index: -1;
      }

      .glass-panel {
        background: var(--glass-bg);
        backdrop-filter: blur(25px);
        -webkit-backdrop-filter: blur(25px);
        border: 1px solid var(--glass-border);
        border-radius: 32px;
        padding: 30px;
        width: 95%;
        max-width: 500px;
        text-align: center;
        box-shadow: 0 40px 80px rgba(0, 0, 0, 0.6);
        position: relative;
      }
      .page {
        display: none;
      }
      .active {
        display: block;
        animation: slideUp 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* UI Elements */
      .ios-input,
      .ios-select {
        background: rgba(0, 0, 0, 0.4);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 16px;
        padding: 15px;
        color: #fff;
        width: 100%;
        outline: none;
        margin-bottom: 10px;
      }
      .ios-select option {
        background: #333;
        color: #fff;
      }

      .btn-ios {
        border: none;
        border-radius: 16px;
        padding: 14px;
        font-weight: 700;
        text-transform: uppercase;
        color: #fff;
        width: 100%;
        margin-bottom: 10px;
        cursor: pointer;
        transition: 0.2s;
      }
      .btn-ios:active {
        transform: scale(0.97);
      }
      .btn-ios:disabled {
        opacity: 0.6;
      }

      .btn-primary-ios {
        background: var(--primary-grad);
      }
      .btn-telegram {
        background: var(--telegram-grad);
      }
      .btn-glass {
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      /* Game Buttons */
      .game-btn {
        height: 140px;
        border-radius: 24px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-weight: 800;
        width: 100%;
        font-size: 1.2rem;
        cursor: pointer;
      }
      .btn-correct {
        background: rgba(48, 209, 88, 0.2);
        color: #86efac;
      }
      .btn-false {
        background: rgba(255, 69, 58, 0.2);
        color: #fca5a5;
      }

      .student-name {
        font-size: 2.4rem;
        font-weight: 800;
        margin: 15px 0;
        background: linear-gradient(180deg, #fff, #b0b0b0);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      /* Undo Button */
      #undoBtn {
        position: absolute;
        top: 15px;
        right: 15px;
        background: rgba(255, 149, 0, 0.2);
        color: #ffb340;
        border: 1px solid rgba(255, 149, 0, 0.3);
        padding: 8px 15px;
        border-radius: 20px;
        font-size: 0.8rem;
        display: none;
        cursor: pointer;
        z-index: 100;
      }

      /* Counters Box */
      .counter-box {
        background: rgba(255, 255, 255, 0.05);
        padding: 8px 15px;
        border-radius: 12px;
        font-size: 0.9rem;
        color: rgba(255, 255, 255, 0.8);
        border: 1px solid rgba(255, 255, 255, 0.1);
        min-width: 100px;
      }

      /* Table */
      .table-custom {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
        margin-bottom: 15px;
      }
      .table-custom th {
        font-size: 0.7rem;
        color: rgba(255, 255, 255, 0.5);
        text-transform: uppercase;
        padding: 8px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }
      .table-custom td {
        padding: 12px 8px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        font-size: 0.95rem;
      }

      .spinner {
        display: inline-block;
        width: 18px;
        height: 18px;
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        border-top-color: #fff;
        animation: spin 1s linear infinite;
        margin-right: 5px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="page1" class="glass-panel page active">
      <h2 class="fw-bold mb-3">History Pro</h2>
      <p>To'lqin Ro'zmatov</p>
      <div style="position: relative">
        <input
          type="text"
          id="studentInput"
          class="ios-input"
          placeholder="Ism kiriting..."
          autocomplete="off"
        />
        <button
          class="btn btn-primary-ios"
          style="
            position: absolute;
            right: 5px;
            top: 5px;
            width: auto;
            padding: 10px 20px;
            border-radius: 12px;
          "
          onclick="addStudent()"
        >
          Add
        </button>
      </div>
      <div
        id="studentListContainer"
        class="text-start mb-3"
        style="max-height: 200px; overflow-y: auto"
      ></div>

      <button
        class="btn-ios btn-glass"
        style="background: var(--success-grad)"
        onclick="startGame()"
      >
        Boshlash 🚀
      </button>
      <button class="btn-ios btn-glass" onclick="openStatistics()">
        📈 Statistika
      </button>
      <button class="btn text-white-50 btn-sm" onclick="clearAllData()">
        Tozalash
      </button>
    </div>

    <div id="page2" class="glass-panel page">
      <button id="undoBtn" onclick="undoLastAction()">↩️ Qaytarish</button>

      <div
        id="stopwatch"
        style="
          font-family: monospace;
          font-size: 2rem;
          background: rgba(0, 0, 0, 0.4);
          padding: 5px 20px;
          border-radius: 14px;
          display: inline-block;
        "
      >
        00:00
      </div>

      <div class="d-flex justify-content-between px-1 mt-3 mb-1">
        <div class="counter-box">
          Jami: <span id="questionNum" class="fw-bold text-white">0</span>
        </div>
        <div class="counter-box">
          student:
          <span id="studentQuestions" class="fw-bold text-white">0</span>
        </div>
      </div>

      <div class="student-name" id="studentName">Student</div>

      <div class="row g-3 mb-3">
        <div class="col-6">
          <button class="game-btn btn-correct" onclick="answer(true)">
            <span>✅</span><span class="mt-2">TO'G'RI</span>
          </button>
        </div>
        <div class="col-6">
          <button class="game-btn btn-false" onclick="answer(false)">
            <span>❌</span><span class="mt-2">XATO</span>
          </button>
        </div>
      </div>

      <div class="row g-2 mt-4">
        <div class="col-6">
          <button class="btn-ios btn-glass" onclick="prevStudent()">
            ← Oldingi
          </button>
        </div>
        <div class="col-6">
          <button class="btn-ios btn-glass" onclick="nextStudent()">
            Keyingi →
          </button>
        </div>
      </div>
      <button class="btn-ios btn-primary-ios mt-3" onclick="finishLesson()">
        Natijalar 📊
      </button>
    </div>

    <div id="page3" class="glass-panel page">
      <h2 class="mb-3 fw-bold">Natijalar</h2>
      <div
        class="table-responsive mb-3"
        style="
          background: rgba(0, 0, 0, 0.3);
          border-radius: 20px;
          padding: 10px;
          max-height: 300px;
          overflow-y: auto;
        "
      >
        <table class="table-custom">
          <thead>
            <tr>
              <th>#</th>
              <th class="text-start">Ism</th>
              <th>T</th>
              <th>%</th>
            </tr>
          </thead>
          <tbody id="leaderboard"></tbody>
        </table>
      </div>
      <button
        id="tgBtn"
        class="btn-ios btn-telegram"
        onclick="sendToTelegram()"
      >
        <span class="spinner" id="tgSpinner" style="display: none"></span> ✈️
        Telegramga yuborish
      </button>
      <button class="btn-ios btn-glass" onclick="backToStart()">
        🏠 Bosh sahifa
      </button>
      <button class="btn-ios btn-glass text-danger" onclick="restart()">
        🔄 Yangi Dars
      </button>
    </div>

    <div id="page4" class="glass-panel page">
      <h2 class="mb-3 fw-bold">📈 O'quvchi Statistikasi</h2>

      <div class="mb-3 text-start">
        <label class="small text-white-50 ms-2"
          >O'quvchini tanlang (Barcha tarix):</label
        >
        <select
          id="statsStudentSelect"
          class="ios-select"
          onchange="renderChart()"
        >
          <option value="">Tanlang...</option>
        </select>
      </div>

      <div
        style="
          background: rgba(0, 0, 0, 0.3);
          border-radius: 20px;
          padding: 10px;
          height: 250px;
        "
      >
        <canvas id="progressChart"></canvas>
      </div>
      <div
        id="chartLoading"
        class="small text-white-50 mt-2"
        style="display: none"
      >
        Ma'lumot yuklanmoqda...
      </div>

      <button class="btn-ios btn-glass mt-4" onclick="backToStart()">
        🏠 Bosh sahifa
      </button>
    </div>

    <audio
      id="soundCorrect"
      src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/3/success.mp3"
    ></audio>
    <audio
      id="soundWrong"
      src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/3/error.mp3"
    ></audio>
    <audio
      id="soundFinish"
      src="https://www.myinstants.com/media/sounds/tada-fanfare-a.mp3"
    ></audio>

    <script>
      // ==========================================
      // SOZLAMALAR (SHU YERNI O'ZGARTIRING)
      // ==========================================
      const GOOGLE_SCRIPT_URL =
        "https://script.google.com/macros/s/AKfycbwfsPg5waRRmjFeVfkCJ4bKL4c3A_tSvwDVO9sTdV1f2BAUggyCJBl5VCHzkIfhUidj/exec"; // YANGI DEPLOY URL
      const CHAT_ID = "-1003235272020"; // GURUH ID
      // ==========================================

      let students = JSON.parse(localStorage.getItem("liquidStudents")) || [];
      let totalQuestions =
        parseInt(localStorage.getItem("totalQuestions")) || 0;
      let currentStudentIndex =
        parseInt(localStorage.getItem("currentStudentIndex")) || 0;
      let stopwatchSeconds = 0;
      let stopwatchInterval = null;

      // UNDO UCHUN TARIX
      let historyStack = [];

      // CHART JS VA BAZA UCHUN
      let myChart = null;
      let globalHistory = [];

      function switchPage(id) {
        document
          .querySelectorAll(".page")
          .forEach((p) => p.classList.remove("active"));
        document.getElementById(id).classList.add("active");
      }

      // --- 1. GAME LOGIC ---
      function addStudent() {
        const val = document.getElementById("studentInput").value.trim();
        if (!val) return;
        students.push({
          name: val,
          correct: 0,
          total: 0,
          totalTime: 0,
          sessionQuestions: 0,
        });
        saveData();
        renderStudentList();
        document.getElementById("studentInput").value = "";
      }

      function startGame() {
        if (!students.length) return alert("O'quvchi yo'q");
        switchPage("page2");
        loadStudent();
      }

      function loadStudent() {
        if (!students[currentStudentIndex]) currentStudentIndex = 0;
        const s = students[currentStudentIndex];

        // Ismni va Hisoblagichlarni yangilash
        document.getElementById("studentName").innerText = s.name;
        updateStats();
        startStopwatch();
      }

      function updateStats() {
        const s = students[currentStudentIndex];
        if (!s) return;
        if (typeof s.sessionQuestions === "undefined") s.sessionQuestions = 0;

        // Ekranga chiqarish
        document.getElementById("questionNum").innerText = totalQuestions;
        document.getElementById("studentQuestions").innerText =
          s.sessionQuestions;
      }

      function answer(isCorrect) {
        stopStopwatch();
        const s = students[currentStudentIndex];

        // Undo tarixiga yozish
        historyStack.push({
          index: currentStudentIndex,
          prevStats: { ...s },
          wasGlobalTotal: totalQuestions,
          timeAdded: stopwatchSeconds,
        });
        document.getElementById("undoBtn").style.display = "block";

        // Ovoz
        const audio = document.getElementById(
          isCorrect ? "soundCorrect" : "soundWrong"
        );
        audio.currentTime = 0;
        audio.play().catch((e) => {});

        // HISOB-KITOB
        s.total++;
        s.sessionQuestions++; // O'quvchiga +1
        totalQuestions++; // Umumiy +1

        if (isCorrect) s.correct++;
        s.totalTime += stopwatchSeconds;

        saveData();
        updateStats(); // Darhol yangilash
        startStopwatch();
      }

      function undoLastAction() {
        if (historyStack.length === 0) return;

        const last = historyStack.pop();
        if (historyStack.length === 0)
          document.getElementById("undoBtn").style.display = "none";

        currentStudentIndex = last.index;
        students[currentStudentIndex] = last.prevStats;
        totalQuestions = last.wasGlobalTotal;

        saveData();
        loadStudent(); // Ekranni va counterlarni yangilaydi
        stopStopwatch();
      }

      function nextStudent() {
        stopStopwatch();
        currentStudentIndex = (currentStudentIndex + 1) % students.length;
        loadStudent();
      }
      function prevStudent() {
        stopStopwatch();
        currentStudentIndex =
          (currentStudentIndex - 1 + students.length) % students.length;
        loadStudent();
      }

      // --- 2. TELEGRAM (FOIZ BO'YICHA REYTING) ---
      async function sendToTelegram() {
        if (!students.length) return;
        const btn = document.getElementById("tgBtn");
        const spinner = document.getElementById("tgSpinner");
        btn.disabled = true;
        spinner.style.display = "inline-block";
        btn.innerHTML = " Yuborilmoqda...";

        const sorted = [...students].sort((a, b) => {
          const pA = a.total ? a.correct / a.total : 0;
          const pB = b.total ? b.correct / b.total : 0;
          if (pB !== pA) return pB - pA;
          return b.correct - a.correct;
        });

        const date = new Date().toLocaleDateString("uz-UZ");
        let msg = `<b>📊 DARS NATIJALARI (${date})</b>\n\n`;

        sorted.forEach((s, i) => {
          const p = s.total ? Math.round((s.correct / s.total) * 100) : 0;
          let rank =
            i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : `${i + 1}.`;
          msg += `${rank} <b>${s.name}</b>: ${p}% (${s.correct}/${s.total})\n`;
        });

        try {
          await fetch(GOOGLE_SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              action: "save",
              text: msg,
              students: students,
            }),
          });
          alert("Yuborildi! ✅");
          btn.classList.replace("btn-telegram", "btn-primary-ios");
          btn.innerHTML = "✅ Muvaffaqiyatli";
        } catch (e) {
          alert("Xato!");
          btn.disabled = false;
          btn.innerHTML = "✈️ Qayta urinish";
        } finally {
          spinner.style.display = "none";
        }
      }

      // --- 3. STATISTIKA VA GRAFIK (MUSTAHKAM VERSIYA) ---
      function openStatistics() {
        switchPage("page4");
        const select = document.getElementById("statsStudentSelect");
        select.innerHTML = '<option value="">Ma\'lumot yuklanmoqda...</option>';
        select.disabled = true;
        fetchGraphData();
      }

      async function fetchGraphData() {
        const loading = document.getElementById("chartLoading");
        const select = document.getElementById("statsStudentSelect");
        loading.style.display = "block";

        try {
          const response = await fetch(GOOGLE_SCRIPT_URL, {
            method: "POST",
            body: JSON.stringify({ action: "get_history" }),
          });

          const data = await response.json();

          if (data.status === "success") {
            globalHistory = data.history;
            loading.style.display = "none";

            let allNames = globalHistory.map((h) => h.name);
            students.forEach((s) => allNames.push(s.name));
            let uniqueNames = [...new Set(allNames)].sort();

            select.innerHTML =
              '<option value="">O\'quvchini tanlang...</option>';
            uniqueNames.forEach((name) => {
              select.innerHTML += `<option value="${name}">${name}</option>`;
            });
            select.disabled = false;
          }
        } catch (e) {
          console.error(e);
          loading.innerText =
            "Internet past yoki Baza ulanmadi. Faqat lokal o'quvchilar.";
          select.innerHTML = '<option value="">Tanlang (Ofline)...</option>';
          [...new Set(students.map((s) => s.name))].sort().forEach((name) => {
            select.innerHTML += `<option value="${name}">${name}</option>`;
          });
          select.disabled = false;
        }
      }

      // Mustahkam sana formatlash funksiyasi
      function formatDate(dateStr) {
        if (!dateStr) return "Dars";
        if (typeof dateStr === "string") {
          let clean = dateStr.substring(0, 10);
          if (clean.includes("-")) {
            let parts = clean.split("-");
            if (parts.length === 3) return `${parts[2]}.${parts[1]}`;
          }
        }
        const d = new Date(dateStr);
        if (!isNaN(d.getTime())) {
          return (
            String(d.getDate()).padStart(2, "0") +
            "." +
            String(d.getMonth() + 1).padStart(2, "0")
          );
        }
        return "Sana?";
      }

      function renderChart() {
        const name = document.getElementById("statsStudentSelect").value;
        if (!name) return;

        let studentData = globalHistory.filter((h) => h.name === name);
        const currentSession = students.find((s) => s.name === name);

        if (currentSession && currentSession.total > 0) {
          const today = new Date();
          const dStr =
            today.getFullYear() +
            "-" +
            (today.getMonth() + 1) +
            "-" +
            today.getDate();
          const p = (
            (currentSession.correct / currentSession.total) *
            100
          ).toFixed(1);
          studentData.push({ date: dStr, percent: p });
        }

        const labels = studentData.map((d, i) => {
          let fd = formatDate(d.date);
          return fd === "Sana?" || fd === "" ? `Dars ${i + 1}` : fd;
        });
        const dataPoints = studentData.map((d) => d.percent);

        const ctx = document.getElementById("progressChart").getContext("2d");
        if (myChart) myChart.destroy();

        myChart = new Chart(ctx, {
          type: "line",
          data: {
            labels: labels,
            datasets: [
              {
                label: name + " (%)",
                data: dataPoints,
                borderColor: "#0A84FF",
                backgroundColor: "rgba(10, 132, 255, 0.2)",
                borderWidth: 3,
                pointBackgroundColor: "#fff",
                pointRadius: 5,
                tension: 0.3,
                fill: true,
              },
            ],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              y: {
                beginAtZero: true,
                max: 100,
                grid: { color: "rgba(255,255,255,0.1)" },
                ticks: { color: "#fff" },
              },
              x: { ticks: { color: "#fff" } },
            },
            plugins: { legend: { labels: { color: "#fff" } } },
          },
        });
      }

      // --- UI & UTILS ---
      function renderStudentList() {
        const c = document.getElementById("studentListContainer");
        if (!students.length)
          c.innerHTML =
            "<div class=\"opacity-50 fst-italic\">Ro'yxat bo'sh</div>";
        else
          c.innerHTML = students
            .map(
              (s, i) => `
                <div class="d-flex justify-content-between bg-dark bg-opacity-25 p-2 rounded mb-1 border border-light border-opacity-10">
                    <span>${i + 1}. ${s.name}</span>
                    <button class="btn btn-sm btn-outline-danger py-0" onclick="removeStudent(${i})">×</button>
                </div>`
            )
            .join("");
      }
      function removeStudent(i) {
        students.splice(i, 1);
        saveData();
        renderStudentList();
      }
      function clearAllData() {
        if (confirm("Aniqmi?")) {
          localStorage.clear();
          students = [];
          renderStudentList();
        }
      }

      function finishLesson() {
        stopStopwatch();
        document
          .getElementById("soundFinish")
          .play()
          .catch((e) => {});
        confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
        switchPage("page3");
        renderLeaderboard();
      }
      function backToStart() {
        switchPage("page1");
        renderStudentList();
      }
      function restart() {
        if (confirm("Yangi dars?")) {
          students.forEach((s) => {
            s.correct = 0;
            s.total = 0;
            s.totalTime = 0;
            s.sessionQuestions = 0;
          });
          totalQuestions = 0;
          historyStack = [];
          saveData();
          switchPage("page1");
        }
      }

      function renderLeaderboard() {
        const sorted = [...students].sort((a, b) => {
          const pA = a.total ? a.correct / a.total : 0;
          const pB = b.total ? b.correct / b.total : 0;
          return pB - pA;
        });
        document.getElementById("leaderboard").innerHTML = sorted
          .map((s, i) => {
            const p = s.total ? Math.round((s.correct / s.total) * 100) : 0;
            let rank = i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : i + 1;
            return `<tr><td class="fw-bold text-warning">${rank}</td><td class="text-start">${
              s.name
            }</td><td>${s.correct}/${s.total}</td><td class="fw-bold ${
              p >= 80
                ? "text-success"
                : p >= 50
                ? "text-warning"
                : "text-danger"
            }">${p}%</td></tr>`;
          })
          .join("");
      }

      function startStopwatch() {
        stopStopwatch();
        stopwatchSeconds = 0;
        document.getElementById("stopwatch").innerText = "00:00";
        stopwatchInterval = setInterval(() => {
          stopwatchSeconds++;
          let m = Math.floor(stopwatchSeconds / 60),
            s = stopwatchSeconds % 60;
          document.getElementById("stopwatch").innerText =
            (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
        }, 1000);
      }
      function stopStopwatch() {
        clearInterval(stopwatchInterval);
      }
      function saveData() {
        localStorage.setItem("liquidStudents", JSON.stringify(students));
        localStorage.setItem("totalQuestions", totalQuestions);
        localStorage.setItem("currentStudentIndex", currentStudentIndex);
      }

      renderStudentList();
    </script>
  </body>
</html>
