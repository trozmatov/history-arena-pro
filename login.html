<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <title>Classroom AI</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
      :root {
        --glass-bg: rgba(20, 20, 30, 0.95);
        --primary: #0a84ff;
        --text: #fff;
      }
      body {
        font-family: "Inter", sans-serif;
        background: url("https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2564&auto=format&fit=crop")
          center fixed;
        background-size: cover;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0;
        color: var(--text);
      }
      .glass-panel {
        background: var(--glass-bg);
        border-radius: 32px;
        padding: 30px;
        width: 95%;
        max-width: 500px;
        text-align: center;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .page {
        display: none;
      }
      .active {
        display: block;
        animation: slideUp 0.4s ease;
      }
      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .ios-input {
        background: rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 12px;
        padding: 15px;
        color: #fff;
        width: 100%;
        outline: none;
        margin-bottom: 10px;
      }
      .btn-ios {
        border: none;
        border-radius: 16px;
        padding: 14px;
        font-weight: 700;
        width: 100%;
        cursor: pointer;
        background: var(--primary);
        color: #fff;
        margin-bottom: 10px;
      }
      .btn-glass {
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      #loginOverlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #000;
        z-index: 9999;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .game-btn {
        height: 140px;
        border-radius: 24px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        width: 100%;
        font-size: 2rem;
        cursor: pointer;
      }
      .btn-correct {
        background: rgba(48, 209, 88, 0.2);
        color: #86efac;
      }
      .btn-false {
        background: rgba(255, 69, 58, 0.2);
        color: #fca5a5;
      }
      #dbModal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.8);
        z-index: 2000;
        display: none;
        justify-content: center;
        align-items: center;
      }
      .db-item {
        display: flex;
        justify-content: space-between;
        padding: 12px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        align-items: center;
      }
    </style>
  </head>
  <body>
    <div id="loginOverlay">
      <div style="width: 90%; max-width: 350px; text-align: center">
        <h2 class="mb-4 fw-bold">🔒 Tizimga kirish</h2>
        <input
          type="text"
          id="loginUser"
          class="ios-input"
          placeholder="Login"
          autocomplete="off"
        />
        <input
          type="password"
          id="loginPass"
          class="ios-input"
          placeholder="Parol"
        />
        <button class="btn-ios mt-3" onclick="doLogin()">KIRISH</button>
        <div id="loginError" class="text-danger mt-2 small"></div>
      </div>
    </div>

    <div id="dbModal">
      <div
        class="glass-panel"
        style="max-height: 80vh; display: flex; flex-direction: column"
      >
        <h4 class="mb-3">Sinf Bazasi (StudentsDB)</h4>
        <div id="dbList" style="overflow-y: auto; flex: 1; margin-bottom: 15px">
          <div class="text-center text-white-50 mt-5">Yuklanmoqda...</div>
        </div>
        <div class="d-flex gap-2">
          <button
            class="btn-ios btn-glass text-danger"
            onclick="document.getElementById('dbModal').style.display='none'"
          >
            Yopish
          </button>
          <button class="btn-ios" onclick="addFromDb()">Qo'shish</button>
        </div>
      </div>
    </div>

    <div id="page1" class="glass-panel page">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="fw-bold m-0">Classroom AI</h4>
        <small class="text-white-50" id="teacherDisplay">...</small>
      </div>

      <div class="d-flex gap-2 mb-2">
        <input
          type="text"
          id="stName"
          class="ios-input"
          placeholder="Yangi o'quvchi ismi..."
          autocomplete="off"
        />
        <button
          class="btn-ios"
          style="width: auto; padding: 0 30px"
          onclick="addSt()"
        >
          +
        </button>
      </div>

      <button
        class="btn-ios btn-glass text-warning btn-sm mb-3"
        onclick="openDb()"
      >
        👥 Bazadan (StudentsDB) tanlash
      </button>

      <div
        id="stList"
        class="text-start mb-3"
        style="max-height: 200px; overflow-y: auto"
      ></div>

      <button class="btn-ios" style="background: #30d158" onclick="start()">
        Boshlash 🚀
      </button>
      <button class="btn-ios btn-glass" onclick="stats()">Statistika</button>
      <button class="btn text-white-50 btn-sm" onclick="logout()">
        Chiqish
      </button>
    </div>

    <div id="page2" class="glass-panel page">
      <div
        id="timer"
        style="
          font-family: monospace;
          font-size: 2rem;
          background: rgba(0, 0, 0, 0.5);
          padding: 5px 15px;
          border-radius: 10px;
          display: inline-block;
        "
      >
        00:00
      </div>
      <div class="d-flex justify-content-between px-2 mt-2 text-white-50 small">
        <span>Jami: <b id="qTotal" class="text-white">0</b></span>
        <span>User: <b id="qUser" class="text-white">0</b></span>
      </div>
      <h2 id="gName" class="my-3 fw-bold">Student</h2>
      <div class="row g-3 mb-4">
        <div class="col-6">
          <button class="game-btn btn-correct" onclick="ans(true)">✅</button>
        </div>
        <div class="col-6">
          <button class="game-btn btn-false" onclick="ans(false)">❌</button>
        </div>
      </div>
      <div class="row g-2">
        <div class="col-6">
          <button class="btn-ios btn-glass" onclick="nav(-1)">← Oldingi</button>
        </div>
        <div class="col-6">
          <button class="btn-ios btn-glass" onclick="nav(1)">Keyingi →</button>
        </div>
      </div>
      <button class="btn-ios mt-3" onclick="finish()">Natijalar</button>
    </div>

    <div id="page3" class="glass-panel page">
      <h3 class="mb-3">Natijalar</h3>
      <div
        id="resList"
        class="mb-3 text-start p-2"
        style="
          background: rgba(0, 0, 0, 0.3);
          border-radius: 15px;
          max-height: 300px;
          overflow-y: auto;
        "
      ></div>
      <button id="tgBtn" class="btn-ios" onclick="sendTg()">
        Telegramga yuborish
      </button>
      <button class="btn-ios btn-glass" onclick="goPage('page1')">
        Bosh sahifa
      </button>
      <button class="btn-ios btn-glass text-danger" onclick="reset()">
        Yangi dars
      </button>
    </div>

    <div id="page4" class="glass-panel page">
      <h3>Statistika</h3>
      <select
        id="statSel"
        class="ios-input"
        style="background: #333"
        onchange="draw()"
      >
        <option>Yuklanmoqda...</option>
      </select>
      <div
        style="
          height: 250px;
          background: rgba(0, 0, 0, 0.3);
          border-radius: 15px;
          padding: 10px;
        "
      >
        <canvas id="chart"></canvas>
      </div>
      <button class="btn-ios btn-glass mt-3" onclick="goPage('page1')">
        Ortga
      </button>
    </div>

    <audio
      id="sY"
      src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/3/success.mp3"
    ></audio>
    <audio
      id="sN"
      src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/3/error.mp3"
    ></audio>
    <audio
      id="sF"
      src="https://www.myinstants.com/media/sounds/tada-fanfare-a.mp3"
    ></audio>

    <script>
      const API =
        "https://script.google.com/macros/s/AKfycbyAh3A2JEcvmJwpN5UKbHKEkSDixH2BTDU0HbPBZCRQAk6ouyovJ-mipUUUOpQtgEjQNg/exec"; // YANGI URL

      let students = JSON.parse(localStorage.getItem("st")) || [];
      let curIdx = 0,
        totalQ = parseInt(localStorage.getItem("tQ")) || 0;
      let timer = 0,
        int = null;
      let hist = [],
        gHist = [],
        chart = null;
      let dbListCache = []; // Bazadan kelganlar uchun

      // LOGIN CHECK
      let teacher = localStorage.getItem("teacherName");
      if (teacher) {
        document.getElementById("loginOverlay").style.display = "none";
        document.getElementById("teacherDisplay").innerText = "👤 " + teacher;
        goPage("page1");
      }

      async function doLogin() {
        let l = document.getElementById("loginUser").value;
        let p = document.getElementById("loginPass").value;
        let btn = document.querySelector("#loginOverlay button");
        let err = document.getElementById("loginError");
        btn.disabled = true;
        btn.innerText = "Tekshirilmoqda...";
        err.innerText = "";

        try {
          let res = await fetch(API, {
            method: "POST",
            body: JSON.stringify({ action: "login", login: l, password: p }),
          });
          let data = await res.json();
          if (data.status === "success") {
            localStorage.setItem("teacherName", data.name);
            location.reload();
          } else {
            err.innerText = "Xato login yoki parol!";
            btn.disabled = false;
            btn.innerText = "KIRISH";
          }
        } catch (e) {
          err.innerText = "Internet xatosi!";
          btn.disabled = false;
          btn.innerText = "KIRISH";
        }
      }

      function logout() {
        if (confirm("Chiqmoqchimisiz?")) {
          localStorage.removeItem("teacherName");
          location.reload();
        }
      }

      function goPage(id) {
        document
          .querySelectorAll(".page")
          .forEach((p) => p.classList.remove("active"));
        document.getElementById(id).classList.add("active");
        renderList();
      }

      function addSt() {
        let n = document.getElementById("stName").value.trim();
        if (!n) return;
        students.push({ name: n, cor: 0, tot: 0, sess: 0 });
        save();
        renderList();
        document.getElementById("stName").value = "";
      }

      // --- YANGI: BAZADAN YUKLASH ---
      async function openDb() {
        document.getElementById("dbModal").style.display = "flex";
        const listDiv = document.getElementById("dbList");

        try {
          // Google Sheetdan yuklaymiz
          let res = await fetch(API, {
            method: "POST",
            body: JSON.stringify({ action: "get_student_list" }),
          });
          let data = await res.json();

          if (data.status === "success" && data.list.length > 0) {
            dbListCache = data.list;
            listDiv.innerHTML = dbListCache
              .map(
                (name, i) => `
                        <div class="db-item">
                            <span class="fw-bold">${name}</span>
                            <input type="checkbox" value="${name}" style="transform:scale(1.5)">
                        </div>
                    `
              )
              .join("");
          } else {
            listDiv.innerHTML =
              '<div class="text-center text-white-50 mt-5">Baza bo\'sh yoki ulanmadi</div>';
          }
        } catch (e) {
          listDiv.innerHTML =
            '<div class="text-center text-danger mt-5">Internet xatosi!</div>';
        }
      }

      function addFromDb() {
        document.querySelectorAll("#dbList input:checked").forEach((c) => {
          let name = c.value;
          if (!students.some((st) => st.name === name))
            students.push({ name: name, cor: 0, tot: 0, sess: 0 });
        });
        save();
        renderList();
        document.getElementById("dbModal").style.display = "none";
      }

      function renderList() {
        document.getElementById("stList").innerHTML = students
          .map(
            (s, i) => `
                <div class="d-flex justify-content-between p-2 mb-1 bg-dark bg-opacity-25 rounded border border-white border-opacity-10">
                    <span class="fw-bold">${i + 1}. ${s.name}</span>
                    <button class="btn btn-sm btn-outline-danger" onclick="students.splice(${i},1);save();renderList()">×</button>
                </div>`
          )
          .join("");
      }

      function start() {
        if (!students.length) return alert("O'quvchi yo'q");
        goPage("page2");
        loadQ();
      }
      function loadQ() {
        if (!students[curIdx]) curIdx = 0;
        let s = students[curIdx];
        document.getElementById("gName").innerText = s.name;
        document.getElementById("qTotal").innerText = totalQ;
        document.getElementById("qUser").innerText = s.sess || 0;
        startT();
      }
      function ans(isCor) {
        stopT();
        let s = students[curIdx];
        document
          .getElementById(isCor ? "sY" : "sN")
          .play()
          .catch((e) => {});
        s.tot++;
        s.sess++;
        totalQ++;
        if (isCor) s.cor++;
        save();
        loadQ();
      }
      function nav(d) {
        stopT();
        curIdx = (curIdx + d + students.length) % students.length;
        loadQ();
      }
      function finish() {
        stopT();
        document
          .getElementById("sF")
          .play()
          .catch((e) => {});
        confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
        goPage("page3");
        students.sort(
          (a, b) => (b.tot ? b.cor / b.tot : 0) - (a.tot ? a.cor / a.tot : 0)
        );
        document.getElementById("resList").innerHTML = students
          .map(
            (s, i) => `
                <div class="d-flex justify-content-between border-bottom border-white border-opacity-10 p-2">
                    <span>${i + 1}. ${s.name}</span>
                    <span class="${
                      (s.cor / s.tot) * 100 >= 80
                        ? "text-success"
                        : "text-warning"
                    } fw-bold">
                        ${s.tot ? Math.round((s.cor / s.tot) * 100) : 0}% (${
              s.cor
            }/${s.tot})
                    </span>
                </div>`
          )
          .join("");
      }
      async function sendTg() {
        let btn = document.getElementById("tgBtn");
        btn.disabled = true;
        btn.innerText = "Yuborilmoqda...";
        let msg =
          `<b>📊 DARS NATIJALARI</b>\n👨‍🏫 O'qituvchi: ${localStorage.getItem(
            "teacherName"
          )}\n\n` +
          students
            .map(
              (s, i) =>
                `${i + 1}. <b>${s.name}</b>: ${
                  s.tot ? Math.round((s.cor / s.tot) * 100) : 0
                }%`
            )
            .join("\n");
        try {
          await fetch(API, {
            method: "POST",
            body: JSON.stringify({
              action: "save",
              text: msg,
              students: students,
              teacher: localStorage.getItem("teacherName"),
            }),
          });
          alert("Yuborildi!");
          btn.innerText = "Muvaffaqiyatli";
        } catch (e) {
          alert("Xato");
          btn.disabled = false;
          btn.innerText = "Qayta urinish";
        }
      }
      async function stats() {
        goPage("page4");
        try {
          let res = await fetch(API, {
            method: "POST",
            body: JSON.stringify({ action: "get_history" }),
          });
          let d = await res.json();
          gHist = d.history;
          let names = [...new Set([...gHist.map((h) => h.name)])].sort();
          document.getElementById("statSel").innerHTML =
            "<option>Tanlang...</option>" +
            names.map((n) => `<option>${n}</option>`);
        } catch (e) {}
      }
      function draw() {
        let n = document.getElementById("statSel").value;
        if (!n) return;
        let d = gHist
          .filter((h) => h.name === n)
          .map((h) => ({ date: h.date, p: h.percent }));
        let cur = students.find((s) => s.name === n);
        if (cur && cur.tot > 0)
          d.push({ date: "Bugun", p: ((cur.cor / cur.tot) * 100).toFixed(1) });
        let ctx = document.getElementById("chart").getContext("2d");
        if (chart) chart.destroy();
        chart = new Chart(ctx, {
          type: "line",
          data: {
            labels: d.map((x) => x.date),
            datasets: [
              {
                label: "%",
                data: d.map((x) => x.p),
                borderColor: "#0A84FF",
                tension: 0.3,
                fill: true,
              },
            ],
          },
        });
      }
      function startT() {
        stopT();
        timer = 0;
        int = setInterval(() => {
          timer++;
          let m = Math.floor(timer / 60),
            s = timer % 60;
          document.getElementById("timer").innerText =
            (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
        }, 1000);
      }
      function stopT() {
        clearInterval(int);
      }
      function save() {
        localStorage.setItem("st", JSON.stringify(students));
        localStorage.setItem("tQ", totalQ);
      }
      function reset() {
        if (confirm("Yangi dars?")) {
          students.forEach((s) => {
            s.cor = 0;
            s.tot = 0;
            s.sess = 0;
          });
          totalQ = 0;
          save();
          goPage("page1");
        }
      }
      renderList();
    </script>
  </body>
</html>
